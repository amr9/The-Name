# Rendered to /etc/nginx/conf.d/default.conf at container start-up, with
# ${CONTACT_UPSTREAM} filled in from the environment.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the version on error pages / headers.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    # Hashed filenames from the Vite build — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Unhashed files from public/ — cached for a day, and a miss is a 404
    # rather than the SPA shell.
    location /media/ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # The contact service. Same origin as the site, so the form's default
    # /api/contact works and CORS never enters the picture.
    location /api/ {
        proxy_pass ${CONTACT_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The service runs with `trust proxy`, so this is what its rate
        # limiter sees as the client IP.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: every other path falls back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or a deploy goes unnoticed.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
